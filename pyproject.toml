[project]
name = "scrapers"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Railson Almeida", email = "railsonalmeida.dev@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "camoufox>=0.4.11",
    "playwright>=1.63.0",
    "python-dotenv>=1.2.3",
    "streamlit>=1.64.0",
]

[tool.uv]
# Repositório de scripts: não há pacote instalável (src/scrapers foi removido).
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Só tests/ na raiz: os test_*.py de src/365-fv/tests são scripts de diagnóstico.
testpaths = ["tests"]
pythonpath = ["src/365-fv"]
